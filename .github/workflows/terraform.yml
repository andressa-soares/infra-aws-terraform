name: Terraform AWS EC2

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create (cria a EC2) ou delete (destroi a EC2)"
        type: choice
        required: true
        default: create
        options: [create, delete]
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

# Uma execucao por vez, para nao corromper o state.
concurrency:
  group: terraform

env:
  # Tag de controle: dispatch usa o input; PR roda so o plan, com "create".
  TF_VAR_action: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'create' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'infra-aws-terraform/ec2/terraform.tfstate' }}" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: |
          set -eo pipefail
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Plan (action=${TF_VAR_action})"
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Aplica so no disparo manual; PR fica no plan.
      - name: Apply
        if: github.event_name == 'workflow_dispatch'
        run: |
          terraform apply -no-color -auto-approve tfplan
          {
            echo "### Outputs"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
